name: Deploy to Virtualmin

on:
    push:
        branches:
            - main # Or whichever branch you want to trigger the deploy

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: 22
                  script: |
                      # Navigate to your Next.js app directory
                      cd odooplus  # Change this to your actual app path

                      # Pull latest changes
                      git pull origin main

                      # Install dependencies (in case package.json changed)
                      npm install

                      # Build the Next.js app
                      npm run build

                      # Restart PM2 process
                      pm2 restart dme-medical.ae

                      # Optional: Save PM2 process list
                      pm2 save

                      # Optional: Show status
                      pm2 status
